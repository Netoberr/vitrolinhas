<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mil poesias de amor pra você</title>
    <meta name="description" content="Mil poesias de amor pra você">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f12;
            --bg-vignette: #060608;
            --overlay-bg: rgba(7, 7, 10, 0.95);
            --wood: #3a2a1f;
            --wood-light: #563e2e;
            --wood-deep: #221812;
            --vinyl: #0b0b0d;
            --vinyl-groove: rgba(255, 255, 255, 0.035);
            --gold: #d4af37;
            --gold-dim: #9c8230;
            --silver: #b5b5b5;
            --silver-dark: #666666;
            --text-title: #f5eedc;
            --text-dim: #8b8075;
            --green-led: #33ff77;
            --turntable-w: clamp(290px, 88vw, 490px);
            --vinyl-size: clamp(170px, 52vw, 270px);
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Montserrat', system-ui, -apple-system, sans-serif;
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            background: radial-gradient(ellipse at 50% 40%, var(--bg) 0%, var(--bg-vignette) 100%);
            color: var(--text-title);
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: var(--overlay-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.8s ease, visibility 0.8s ease;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .btn-start {
            background: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
            padding: 1.2rem 2.2rem;
            font-size: 0.88rem;
            font-family: var(--font-sans);
            font-weight: 500;
            cursor: pointer;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            line-height: 1.9;
            max-width: 85vw;
            text-align: center;
            transition: all 0.35s ease;
            animation: btn-glow 2.5s ease-in-out infinite;
        }

        .btn-start:hover,
        .btn-start:active {
            background: var(--gold);
            color: #0b0b0d;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.35);
            transform: scale(1.02);
        }

        @keyframes btn-glow {
            0%, 100% { box-shadow: 0 0 10px rgba(212, 175, 55, 0.12); }
            50% { box-shadow: 0 0 24px rgba(212, 175, 55, 0.28); }
        }

        .scene {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            padding: 1.2rem;
            gap: 1.2rem;
        }

        .turntable {
            position: relative;
        }

        .turntable-base {
            position: relative;
            width: var(--turntable-w);
            aspect-ratio: 1.38;
            background:
                repeating-linear-gradient(
                    168deg,
                    transparent,
                    transparent 4px,
                    rgba(0, 0, 0, 0.05) 4px,
                    rgba(0, 0, 0, 0.05) 5px
                ),
                linear-gradient(
                    155deg,
                    var(--wood-light) 0%,
                    var(--wood) 38%,
                    var(--wood-deep) 100%
                );
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow:
                0 6px 20px rgba(0, 0, 0, 0.6),
                0 18px 50px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .platter {
            position: absolute;
            top: 50%;
            left: 40%;
            transform: translate(-50%, -50%);
            width: calc(var(--vinyl-size) + 16px);
            height: calc(var(--vinyl-size) + 16px);
            border-radius: 50%;
            background: radial-gradient(circle at 45% 40%, #29292d 0%, #17171a 80%, #0d0d0f 100%);
            box-shadow:
                inset 0 2px 10px rgba(0, 0, 0, 0.7),
                0 1px 0 rgba(255, 255, 255, 0.04);
        }

        .vinyl {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: var(--vinyl-size);
            height: var(--vinyl-size);
            border-radius: 50%;
            background: var(--vinyl);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6), 0 0 0 2px rgba(35, 35, 40, 0.8);
        }

        .vinyl::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: repeating-radial-gradient(
                circle,
                transparent 0,
                transparent 3px,
                var(--vinyl-groove) 3.5px,
                transparent 4px
            );
        }

        .vinyl::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: linear-gradient(
                130deg,
                transparent 18%,
                rgba(255, 255, 255, 0.02) 38%,
                rgba(255, 255, 255, 0.06) 47%,
                rgba(255, 255, 255, 0.02) 56%,
                transparent 78%
            );
            pointer-events: none;
            z-index: 2;
        }

        @keyframes spin {
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .is-playing .vinyl {
            animation: spin 2.2s linear infinite;
        }

        .vinyl-center-media {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 38%;
            height: 38%;
            border-radius: 50%;
            background: #141416;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.5), inset 0 0 10px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }

        .center-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            filter: contrast(1.05) brightness(0.98);
        }

        .center-ring {
            position: absolute;
            inset: 3px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.18);
            pointer-events: none;
        }

        .vinyl-center-media::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #1a1a1d;
            border: 1px solid #444;
            box-shadow: inset 0 0 2px rgba(0,0,0,0.8);
            z-index: 6;
        }

        .tonearm {
            position: absolute;
            top: 8%;
            right: 12%;
            width: 44px;
            height: 60%;
            transform-origin: center 7px;
            transform: rotate(-10deg);
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            z-index: 10;
        }

        .tonearm-pivot {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: radial-gradient(circle at 38% 32%, #a8a8a8, #444);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 2;
        }

        .tonearm-weight {
            position: absolute;
            top: 17px;
            left: 50%;
            transform: translateX(-50%);
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #888, #333);
        }

        .tonearm-shaft {
            position: absolute;
            top: 13px;
            left: 50%;
            transform: translateX(-50%);
            width: 3px;
            height: calc(100% - 22px);
            background: linear-gradient(to right, #777, var(--silver), #777);
            border-radius: 2px;
        }

        .tonearm-head {
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-60%) rotate(-22deg);
            transform-origin: center top;
            width: 16px;
            height: 18px;
        }

        .tonearm-head::before {
            content: '';
            display: block;
            width: 8px;
            height: 12px;
            background: linear-gradient(to bottom, #6b6b6b, #3d3d3d);
            border-radius: 1px;
            margin: 0 auto;
        }

        .tonearm-head::after {
            content: '';
            display: block;
            width: 1px;
            height: 5px;
            background: var(--gold);
            margin: 1px auto 0;
        }

        .turntable:not(.is-playing) .tonearm:hover {
            filter: brightness(1.2);
        }

        .is-playing .tonearm {
            transform: rotate(25deg);
            cursor: default;
        }

        .turntable-controls {
            position: absolute;
            bottom: 8%;
            left: 8%;
            right: 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .led {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--green-led);
            box-shadow: 0 0 4px var(--green-led), 0 0 10px rgba(51, 255, 119, 0.35);
        }

        .speed-selector {
            display: flex;
            gap: 10px;
            font-size: clamp(8px, 1.8vw, 10px);
            color: var(--text-dim);
            letter-spacing: 0.5px;
            font-family: var(--font-sans);
        }

        .speed-selector .active {
            color: var(--gold);
            font-weight: 500;
        }

        .instruction {
            font-size: clamp(0.7rem, 2.5vw, 0.85rem);
            color: var(--gold-dim);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-align: center;
            font-weight: 400;
            animation: pulse 2.2s ease-in-out infinite;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .is-playing ~ .instruction {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .love-message {
            font-family: var(--font-serif);
            font-size: clamp(1.4rem, 4.8vw, 2.1rem);
            font-weight: 500;
            letter-spacing: 1px;
            line-height: 1.4;
            text-align: center;
            max-width: min(92vw, 560px);
            color: var(--text-title);
            opacity: 0;
            transform: translateY(18px);
            transition: opacity 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            transition-delay: 0.4s;
            padding: 0 0.5rem;
            text-shadow: 0 2px 14px rgba(0, 0, 0, 0.7);
        }

        .is-playing ~ .love-message {
            opacity: 1;
            transform: translateY(0);
        }

        @media (min-width: 480px) {
            :root {
                --turntable-w: clamp(350px, 65vw, 510px);
                --vinyl-size: clamp(210px, 36vw, 290px);
            }
        }

        @media (min-width: 768px) {
            :root {
                --turntable-w: min(54vw, 530px);
                --vinyl-size: min(30vw, 310px);
            }

            .love-message {
                font-size: 2.25rem;
            }
        }

        @media (max-height: 600px) {
            :root {
                --turntable-w: clamp(230px, 55vh, 360px);
                --vinyl-size: clamp(140px, 32vh, 210px);
            }

            .scene {
                gap: 0.6rem;
            }

            .love-message {
                font-size: clamp(1.1rem, 3.2vw, 1.4rem);
            }
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay">
        <button class="btn-start" id="btnStart">
            Coloque o fone de ouvido ou aumente o volume<br>e toque para iniciar
        </button>
    </div>

    <main class="scene" id="scene">
        <div class="turntable" id="turntable">
            <div class="turntable-base">

                <div class="platter">
                    <div class="vinyl" id="vinyl">
                        <div class="vinyl-center-media">
                            <img src="midia.png" alt="Mídia do Disco" class="center-photo" draggable="false">
                            <div class="center-ring"></div>
                        </div>
                    </div>
                </div>

                <div class="tonearm" id="tonearm">
                    <div class="tonearm-pivot"></div>
                    <div class="tonearm-weight"></div>
                    <div class="tonearm-shaft">
                        <div class="tonearm-head"></div>
                    </div>
                </div>

                <div class="turntable-controls">
                    <div class="led"></div>
                    <div class="speed-selector">
                        <span>33</span>
                        <span class="active">45</span>
                    </div>
                </div>
            </div>
        </div>

        <p class="instruction" id="instruction">Toque na agulha para tocar</p>

        <p class="love-message" id="loveMessage">
            mil poesias de amor pra você
        </p>
    </main>

    <audio id="audioPlayer" preload="auto">
        <source src="musica.mp3" type="audio/mpeg">
        <source src="musica.m4a" type="audio/mp4">
    </audio>

    <script>
        (() => {
            const overlay = document.getElementById('overlay');
            const btnStart = document.getElementById('btnStart');
            const turntable = document.getElementById('turntable');
            const tonearm = document.getElementById('tonearm');
            const audioPlayer = document.getElementById('audioPlayer');

            let audioContext = null;
            let isAudioActive = false;

            const initAudioContext = () => {
                try {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch {
                    /* Web Audio API indisponível */
                }
            };

            const playVinylNoise = () => {
                if (!audioContext) return;

                const sampleRate = audioContext.sampleRate;
                const bufferDuration = 6;
                const bufferLength = sampleRate * bufferDuration;
                const noiseBuffer = audioContext.createBuffer(2, bufferLength, sampleRate);

                for (let channel = 0; channel < 2; channel++) {
                    const channelData = noiseBuffer.getChannelData(channel);
                    for (let i = 0; i < bufferLength; i++) {
                        channelData[i] = (Math.random() * 2 - 1) * 0.01;

                        if (Math.random() > 0.9996) {
                            const pop = (Math.random() * 2 - 1) * 0.12;
                            const decay = Math.min(150, bufferLength - i);
                            for (let j = 0; j < decay; j++) {
                                channelData[i + j] += pop * Math.exp(-j / 25);
                            }
                        }
                    }
                }

                const noiseSource = audioContext.createBufferSource();
                noiseSource.buffer = noiseBuffer;
                noiseSource.loop = true;

                const bandpassFilter = audioContext.createBiquadFilter();
                bandpassFilter.type = 'bandpass';
                bandpassFilter.frequency.value = 1100;
                bandpassFilter.Q.value = 0.6;

                const lowpassFilter = audioContext.createBiquadFilter();
                lowpassFilter.type = 'lowpass';
                lowpassFilter.frequency.value = 3500;

                const gainControl = audioContext.createGain();
                gainControl.gain.value = 0.25;

                noiseSource.connect(bandpassFilter);
                bandpassFilter.connect(lowpassFilter);
                lowpassFilter.connect(gainControl);
                gainControl.connect(audioContext.destination);

                noiseSource.start();
            };

            const startMusic = () => {
                if (audioPlayer) {
                    audioPlayer.currentTime = 0;
                    audioPlayer.play().catch(() => {});
                }
            };

            btnStart.addEventListener('click', () => {
                initAudioContext();
                overlay.classList.add('hidden');
            });

            const activateTurntable = () => {
                if (isAudioActive) return;
                isAudioActive = true;
                turntable.classList.add('is-playing');
            };

            tonearm.addEventListener('click', activateTurntable);
            tonearm.addEventListener('touchend', (event) => {
                event.preventDefault();
                activateTurntable();
            });

            tonearm.addEventListener('transitionend', (event) => {
                if (event.target !== tonearm || event.propertyName !== 'transform') return;

                playVinylNoise();
                startMusic();
            });
        })();
    </script>
</body>
</html>
